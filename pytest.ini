[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --reruns 2
    --reruns-delay 2
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video retain-on-failure
    --output test-results

markers =
    smoke: quick sanity checks
    regression: full regression suite